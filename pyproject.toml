[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edmt"
version = "1.0.9"
description = "Environmental Data Management Toolbox for geospatial, conservation, Earth Engine, Airdata and environmental analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Francis Odero" , email = "francisodero10@gmail.com" },
    { name = "Eugene Kuloba" },
]

classifiers = [

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [
    "gis",
    "geospatial",
    "earth-engine",
    "remote-sensing",
    "conservation",
    "spatial-analysis",
    "geopandas",
    "environment",
    "airdata",
    "drone"
]

dependencies = [
    "earthengine-api>=0.1.324",
    "geopandas>=1.0",
    "pandas>=2.2",
    "duckdb>=1.0",
    "fiona>=1.9",
    "requests>=2.31",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "qrcode>=8.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8",
    "pytest-cov",
    "flake8",
    "build",
    "twine",
]

docs = [
    "sphinx",
    "furo",
    "myst-parser",
]

all = [
    "pytest>=8",
    "pytest-cov",
    "flake8",
    "build",
    "twine",
    "sphinx",
    "furo",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/envdmt/EDMT"
Documentation = "https://envdmt.github.io/EDMT/"
Repository = "https://github.com/envdmt/EDMT"
Issues = "https://github.com/envdmt/EDMT/issues"

[project.scripts]
edmt = "edmt.cli:main"

[tool.setuptools.packages.find]
include = ["edmt*"]